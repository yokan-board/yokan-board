  /v1.1/contacts/bulk:
    post:
      summary: Bulk import contacts
      tags:
        - Contacts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contacts
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Contact'
                strategy:
                  type: string
                  enum: [merge, skip, replace]
                  default: merge
                  description: How to handle existing contacts with the same email.
      responses:
        '200':
          description: Bulk import results
